name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install IRIS with all development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"
          python -m pip check
      - name: Check scientific dependency readiness
        run: python -m iris doctor --strict --json
      - name: Check formatting
        run: python -m ruff format --check src tests
      - name: Lint
        run: python -m ruff check src tests
      - name: Type-check
        run: python -m mypy src/iris

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install IRIS and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ml]"
          python -m pip check
      - name: Test
        run: python -m pytest -q --cov=iris --cov-report=term-missing
      - name: Byte-compile
        run: python -m compileall -q src tests

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit complete declared dependency graph
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt

  package:
    needs: [quality, test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2"
      - name: Build source and wheel distributions
        run: python -m build
      - name: Verify source-distribution support files
        shell: bash
        run: |
          set -euo pipefail
          sdist_path="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "${sdist_path}"
          archive_listing="$(tar -tzf "${sdist_path}")"
          for required in SECURITY.md CONTRIBUTING.md docs/ARCHITECTURE.md examples/README.md; do
            grep -q "/${required}$" <<<"${archive_listing}"
          done
      - name: Verify wheel in an isolated environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/iris-wheel-smoke"
          wheel_path="$(find "${GITHUB_WORKSPACE}/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "${wheel_path}"
          "${RUNNER_TEMP}/iris-wheel-smoke/bin/python" -m pip install "${wheel_path}"
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/iris-wheel-smoke/bin/python" -m pip check
          "${RUNNER_TEMP}/iris-wheel-smoke/bin/python" - <<'PY'
          from importlib.metadata import version
          from importlib.resources import files
          import iris

          assert version("iris-astronomy") == iris.__version__
          package_root = files("iris")
          assert package_root.joinpath("default.toml").is_file()
          assert package_root.joinpath("py.typed").is_file()
          PY
          "${RUNNER_TEMP}/iris-wheel-smoke/bin/iris" doctor --json
          "${RUNNER_TEMP}/iris-wheel-smoke/bin/iris" config-show
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iris-distributions
          path: dist/*
          if-no-files-found: error
