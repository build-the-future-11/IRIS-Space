name: Development population preparation

on:
  pull_request:
    paths:
      - 'src/siderea/ml/space_jepa_population_v1.py'
      - 'src/siderea/ml/space_jepa_v2_data.py'
      - 'src/siderea/ml/prequential.py'
      - 'tests/test_space_jepa_population_v1.py'
      - 'tests/test_space_jepa_population_as_of.py'
      - 'scripts/demo_space_jepa_population_v1.py'
      - '.github/workflows/population-preparation.yml'

permissions:
  contents: read

jobs:
  generated-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26,<2.5' 'pandas>=2.2' pytest
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify exact source and generated data contracts
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python -m pytest -q -W error tests/test_space_jepa_population_as_of.py tests/test_space_jepa_population_v1.py tests/test_space_jepa_v2_preparation_integrity.py tests/test_space_jepa_v2_data.py tests/test_prequential.py
