name: Public cadence input contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  input-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install parser and development dependencies
        run: python -m pip install -e '.[dev]' 'astropy>=6'
      - name: Verify input parser and exact-byte replay
        run: python -m pytest -q tests/test_public_cadence.py
      - name: Reproduce the pinned input artifact
        run: |
          python -m siderea.public_cadence tests/fixtures/public_cadence/tess-pimen-100.fits --source tests/fixtures/public_cadence/source.json --output-dir "$RUNNER_TEMP/public-cadence"
          python -m siderea.public_cadence tests/fixtures/public_cadence/tess-pimen-100.fits --source tests/fixtures/public_cadence/source.json --output-dir "$RUNNER_TEMP/public-cadence"
