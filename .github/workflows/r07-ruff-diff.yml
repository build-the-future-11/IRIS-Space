name: R07 Ruff import diff

on:
  pull_request:
    paths:
      - 'tests/test_release_r07.py'
      - '.github/workflows/r07-ruff-diff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ruff only
        run: python -m pip install 'ruff==0.16.9'
      - name: Show Ruff import fix
        run: python -m ruff check --select I001 --diff tests/test_release_r07.py
