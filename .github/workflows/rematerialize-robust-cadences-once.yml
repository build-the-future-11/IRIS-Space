name: Rematerialize frozen robust-search cadences once

on:
  push:
    branches:
      - research/robust-cadence-materialization-fix-20260909

permissions:
  contents: write

jobs:
  rematerialize:
    if: ${{ !contains(github.event.head_commit.message, '[cadence-rematerialized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: research/robust-cadence-materialization-fix-20260909
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the same scientific/test dependency surface as CI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ml]"
          python -m pip check
      - name: Recreate only the frozen cadence input artifact
        shell: bash
        run: |
          set -euo pipefail
          rm paper/experiments/robust_search_cadences.v2.json
          python paper/experiments/materialize_robust_search_cadences.py
      - name: Verify the frozen digest and complete predevelopment gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          path = Path("paper/experiments/robust_search_cadences.v2.json")
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = "5abfdaa328f5793e92bed7aa6dcfaade44ac1a54a1996b8c310e51112dc72451"
          if actual != expected:
              raise SystemExit(f"frozen cadence digest mismatch: expected {expected}, got {actual}")
          print(actual)
          PY
          python paper/experiments/verify_robust_search_predevelopment.py
      - name: Commit only the corrected frozen input artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/experiments/robust_search_cadences.v2.json
          git diff --cached --quiet && { echo "No cadence change to commit"; exit 0; }
          git commit -m "fix(research): rematerialize frozen cadence artifact [cadence-rematerialized]"
          git push origin HEAD:research/robust-cadence-materialization-fix-20260909
