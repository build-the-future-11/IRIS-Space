[general]
name = "SIDEREA"
campaign = "jepa_research"
environment = "research"

[storage]
root = "../var/siderea"
datasets_dir = "../var/siderea/datasets"

[jepa]
enabled = true
shadow_mode = true
dataset_path = "../var/siderea/datasets/jepa"
embedding_dim = 256
encoder_layers = 6
attention_heads = 8
mask_fraction = 0.50
# Draw 0.25, 0.50, or 0.75-scale contiguous targets per curve so short-lived
# events and slower evolution are both represented during training/evaluation.
mask_scale_jitter = 0.50
learning_rate = 0.0003
batch_size = 128
seed = 2026
