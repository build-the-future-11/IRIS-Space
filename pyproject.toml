[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siderea-astronomy"
version = "0.3.0"
description = "SIDEREA: reproducible, human-supervised astronomical transient discovery"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [
  { name = "Aadi Ajeesh Nair", email = "aadinair310@gmail.com" },
  { name = "Ryan Gomez", email = "ryangomez.hs@gmail.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
]

[project.optional-dependencies]
astronomy = [
  "alerce>=2.2.1,<3",
  "astropy>=6.0",
  "astroquery>=0.4.8",
]
ml = [
  "scikit-learn>=1.4",
  "torch>=2.2",
]
visualization = [
  "matplotlib>=3.8",
]
all = [
  "alerce>=2.2.1,<3",
  "astropy>=6.0",
  "astroquery>=0.4.8",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "torch>=2.2",
]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pandas-stubs>=2.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
siderea = "siderea.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
siderea = ["default.toml", "py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["siderea"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "cool-stuff-master",
  "ai_candidate_hunter.py",
  "blackhole_candidate_hunter.py",
  "catalog_validation_engine.py",
  "distant_reservoir_catalog.py",
  "fetch_alerce_detections.py",
  "final_candidate_filter.py",
  "optical_transient_pipeline.py",
  "run_1000_candidate_hunt.py",
  "verify_candidates.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["siderea"]

[[tool.mypy.overrides]]
module = [
  "alerce",
  "alerce.*",
  "astropy",
  "astropy.*",
  "astroquery",
  "astroquery.*",
]
ignore_missing_imports = true
